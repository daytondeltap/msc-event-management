name: Cross-device UI smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  responsive-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save @playwright/test@1.62.1
          npx playwright install --with-deps chromium
      - name: Start static app
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/msc-http.log 2>&1 &
          echo $! > /tmp/msc-http.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/msc-http.log
          exit 1
      - name: Run UI, feature, identity and polish tests
        run: npx playwright test tests/device-smoke.spec.js tests/feature-smoke.spec.js tests/prod-hardening.spec.js tests/readme-sanity.spec.js tests/account-isolation.spec.js tests/logout-identity.spec.js tests/ui-polish.spec.js --reporter=line --workers=1
