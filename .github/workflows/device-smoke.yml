name: Production browser regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static app
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/gem-http.log 2>&1 &
          echo $! > /tmp/gem-http.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/gem-http.log
          exit 1
      - name: Run cross-device UI tests
        id: device
        continue-on-error: true
        run: npx playwright test tests/device-smoke.spec.js --reporter=line --workers=1
      - name: Run README feature smoke tests
        id: features
        continue-on-error: true
        run: npx playwright test tests/full-feature-smoke.spec.js --reporter=line --workers=1
      - name: Run Plan graph and scale tests
        id: plan_scale
        continue-on-error: true
        run: npx playwright test tests/plan-scale-smoke.spec.js --reporter=line --workers=1
      - name: Run Supabase and OAuth health tests
        id: backend
        continue-on-error: true
        run: npx playwright test tests/backend-health.spec.js --reporter=line --workers=1
      - name: Fail if any regression suite failed
        if: always()
        run: |
          failed=0
          [ "${{ steps.device.outcome }}" = "success" ] || failed=1
          [ "${{ steps.features.outcome }}" = "success" ] || failed=1
          [ "${{ steps.plan_scale.outcome }}" = "success" ] || failed=1
          [ "${{ steps.backend.outcome }}" = "success" ] || failed=1
          exit $failed
