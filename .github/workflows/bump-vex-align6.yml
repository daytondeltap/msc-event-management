name: Bump VEX Align6 release

on:
  push:
    paths:
      - '.github/vex-align6-release'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Bump corrected geometry and browser namespaces
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/pages.yml')
          s=p.read_text()
          s=s.replace('hosted-vex-iq-github-step-mirror-v5-explicit-standoffs','hosted-vex-iq-github-step-mirror-v6-explicit-standoffs')
          s=s.replace('src-align5','src-align6').replace('align5','align6')
          p.write_text(s)
          PY
          grep -q 'hosted-vex-iq-github-step-mirror-v6-explicit-standoffs' .github/workflows/pages.yml
          grep -q 'src-align6/app-stable.js?v=align6' .github/workflows/pages.yml
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/pages.yml
          git diff --cached --quiet && exit 0
          git commit -m 'deploy: rebuild corrected standoff manifest'
          git push origin HEAD:main
