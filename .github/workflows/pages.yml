name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout MSC site
        uses: actions/checkout@v7
        with:
          path: host

      - name: Checkout VEX CAD
        uses: actions/checkout@v7
        with:
          repository: daytondeltap/vex-cad
          ref: main
          path: vex-source

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test VEX CAD editor core
        working-directory: vex-source
        run: node --test tests/*.test.mjs

      - name: Restore VEX geometry cache
        id: vex-cache
        uses: actions/cache/restore@v4
        with:
          path: vex-source/.vex-parts-cache
          key: hosted-vex-iq-github-step-mirror-v3

      - name: Generate VEX geometry cache
        if: steps.vex-cache.outputs.cache-hit != 'true'
        working-directory: vex-source
        run: |
          python -m pip install --disable-pip-version-check cadquery
          rm -rf .vex-parts-cache
          curl --fail --location --retry 5 --retry-all-errors \
            'https://codeload.github.com/vex-ru/vex-iq-stl/zip/refs/heads/main' \
            -o "$RUNNER_TEMP/vex-iq-step-mirror.zip"
          test -s "$RUNNER_TEMP/vex-iq-step-mirror.zip"
          python tools/build_parts.py \
            --zip "$RUNNER_TEMP/vex-iq-step-mirror.zip" \
            --out .vex-parts-cache

      - name: Save VEX geometry cache
        if: steps.vex-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vex-source/.vex-parts-cache
          key: hosted-vex-iq-github-step-mirror-v3

      - name: Restore VEX browser runtimes
        id: runtime-cache
        uses: actions/cache/restore@v4
        with:
          path: vex-source/.browser-runtime-cache
          key: hosted-vex-runtime-three-0.185.1-occt-0.0.28-supabase-2.115.0-v3

      - name: Build VEX browser runtime cache
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        working-directory: vex-source
        run: |
          rm -rf .browser-runtime-cache node_modules
          mkdir -p .browser-runtime-cache/vendor/addons/controls .browser-runtime-cache/occt
          npm install --no-save --ignore-scripts --no-audit --no-fund \
            three@0.185.1 \
            @sunbox/occt-import-js@0.0.28 \
            @supabase/supabase-js@2.115.0
          cp node_modules/three/build/three.module.js .browser-runtime-cache/vendor/three.module.js
          cp node_modules/three/build/three.core.js .browser-runtime-cache/vendor/three.core.js
          cp node_modules/three/examples/jsm/controls/OrbitControls.js .browser-runtime-cache/vendor/addons/controls/OrbitControls.js
          cp node_modules/three/examples/jsm/controls/TransformControls.js .browser-runtime-cache/vendor/addons/controls/TransformControls.js
          cp node_modules/@sunbox/occt-import-js/dist/occt-import-js-worker.js .browser-runtime-cache/occt/occt-import-js-worker.js
          cp node_modules/@sunbox/occt-import-js/dist/occt-import-js.js .browser-runtime-cache/occt/occt-import-js.js
          cp node_modules/@sunbox/occt-import-js/dist/occt-import-js.wasm .browser-runtime-cache/occt/occt-import-js.wasm
          SUPABASE_UMD="$(find node_modules/@supabase/supabase-js -path '*/dist/umd/supabase.js' -print -quit)"
          test -n "$SUPABASE_UMD"
          cp "$SUPABASE_UMD" .browser-runtime-cache/vendor/supabase.js

      - name: Save VEX browser runtimes
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vex-source/.browser-runtime-cache
          key: hosted-vex-runtime-three-0.185.1-occt-0.0.28-supabase-2.115.0-v3

      - name: Stage combined static site
        run: |
          rm -rf site
          mkdir -p site/vex-cad/parts
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            host/ site/
          cp vex-source/index.html vex-source/styles.css vex-source/collab.css site/vex-cad/
          cp -R vex-source/src site/vex-cad/src
          cp -R vex-source/.vex-parts-cache/. site/vex-cad/parts/
          cp -R vex-source/.browser-runtime-cache/vendor site/vex-cad/vendor
          cp -R vex-source/.browser-runtime-cache/occt site/vex-cad/occt
          touch site/.nojekyll

      - name: Validate VEX CAD deployment payload
        working-directory: vex-source
        run: |
          node scripts/check-assets.mjs ../site/vex-cad/parts/manifest.json
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check scripts/browser-smoke.mjs
          test -s ../site/vex-cad/index.html
          test -s ../site/vex-cad/styles.css
          test -s ../site/vex-cad/collab.css
          test -s ../site/vex-cad/src/app-stable.js
          test -s ../site/vex-cad/src/multiplayer.js
          grep -q './src/app-stable.js?v=stable4' ../site/vex-cad/index.html
          test -s ../site/vex-cad/vendor/three.module.js
          test -s ../site/vex-cad/vendor/three.core.js
          test -s ../site/vex-cad/vendor/supabase.js
          test -s ../site/vex-cad/vendor/addons/controls/OrbitControls.js
          test -s ../site/vex-cad/vendor/addons/controls/TransformControls.js
          test -s ../site/vex-cad/occt/occt-import-js-worker.js
          test -s ../site/vex-cad/occt/occt-import-js.js
          test -s ../site/vex-cad/occt/occt-import-js.wasm

      - name: Browser smoke VEX CAD library and rendering
        working-directory: vex-source
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.62.1
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_PATH"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory ../site > "$RUNNER_TEMP/vex-http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/vex-cad/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/vex-cad/ >/dev/null
          CHROME_PATH="$CHROME_PATH" VEX_SMOKE_URL='http://127.0.0.1:4173/vex-cad/' node scripts/browser-smoke.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload combined static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
