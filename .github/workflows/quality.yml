name: Production quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax check
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -maxdepth 2 -type f -name '*.js' -print0)
      - name: Public-secret guard
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='quality.yml' '(service_role|SUPABASE_SERVICE_ROLE_KEY|sb_secret_)' .; then
            echo 'Potential server-only Supabase credential reference found in public repository.' >&2
            exit 1
          fi
      - name: Core production files exist
        shell: bash
        run: |
          test -s index.html
          test -s app-core.js
          test -s app-bind.js
          test -s app-v28-production.js
          test -s features-v28-production.css
