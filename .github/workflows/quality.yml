name: Production quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: JavaScript syntax check
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -maxdepth 2 -type f -name '*.js' -print0)
      - name: Public-secret guard
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='quality.yml' '(service_role|SUPABASE_SERVICE_ROLE_KEY|sb_secret_)' .; then
            echo 'Potential server-only Supabase credential reference found in public repository.' >&2
            exit 1
          fi
      - name: Production boot contract
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s app-core.js
          test -s app-bind.js
          test -s app-v28-production.js
          test -s app-v32-budget-qol.js
          test -s app-v33-prod-qol.js
          test -s app-v34-sanity.js
          test -s app-v35-storage-scope.js
          test -s app-v35-auth-isolation.js
          test -s app-v35-node-drag.js
          test -s tests/account-isolation.spec.js
          test -s tests/ui-polish.spec.js
          test -s features-v28-production.css
          test -s features-v32-qol.css
          test -s features-v33-prod.css
          test -s features-v37-polish.css
          grep -q '20260824-account-v35' index.html
          grep -q '20260824-ui-v37' index.html
          grep -q 'app-v35-storage-scope.js' index.html
          grep -q 'app-v35-auth-isolation.js' index.html
          grep -q 'app-v35-node-drag.js' index.html
          grep -q 'app-v34-sanity.js' config.js
          grep -q 'app-v33-prod-qol.js' config.js
          grep -q 'features-v33-prod.css' config.js
          grep -q 'features-v37-polish.css' config.js
          grep -q 'prefers-reduced-motion:reduce' features-v37-polish.css
          grep -q 'backdrop-filter:none' features-v37-polish.css
          if grep -Eq 'transition[[:space:]]*:[[:space:]]*all|backdrop-filter[[:space:]]*:[[:space:]]*blur' features-v37-polish.css; then
            echo 'v37 polish contains a broad transition or expensive backdrop blur.' >&2
            exit 1
          fi
          grep -q 'Content-Security-Policy' index.html
